name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://errwise:errwise@localhost:5432/errwise
      DIRECT_URL: postgresql://errwise:errwise@localhost:5432/errwise
      JWT_SECRET: ci-only-secret-not-used-in-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_HARDENED_MODE: false

      - name: Build shared package
        run: yarn workspace @errwise/shared build

      - name: Generate Prisma client
        run: yarn workspace @errwise/api prisma generate

      - name: Build API
        run: yarn workspace @errwise/api build
