services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: errwise
      POSTGRES_PASSWORD: errwise
      POSTGRES_DB: errwise
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errwise"]
      interval: 5s
      retries: 10
volumes:
  dbdata:
