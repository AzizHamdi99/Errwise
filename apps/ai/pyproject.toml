[project]
name = "errwise-ai"
version = "0.1.0"
description = "Errwise AI service: stateless analysis of error events. Never touches the database."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import order, B: bugbear, UP: modern syntax,
# S: security checks, SIM: simplifications, ASYNC: async mistakes.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # assert is how pytest works, secrets in tests are fake
